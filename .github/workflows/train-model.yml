name: Train Weather Model

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  MODEL_S3_BUCKET: amzn-s3-bucker-weather
  MODEL_S3_KEY: models/xgboost_model.joblib
  RAW_DATA_S3_KEY: data/raw/saudi_weather_data.csv

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::267834696944:role/github-actions-weather-training-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Download training CSV from S3
        run: |
          mkdir -p data/raw
          aws s3 cp s3://${MODEL_S3_BUCKET}/${RAW_DATA_S3_KEY} data/raw/saudi_weather_data.csv
          ls -lh data/raw/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model and upload to S3
        run: |
          python -m src.run_pipeline