<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ADK — Weather Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  :root {
    --bg: #0b0f1d;
    --border: #17203c;
    --border-input: #26375e;
    --panel: #101a30;
    --accent: #3348c4;
    --accent-grad: linear-gradient(145deg, #5b7cf5, #3348c4);
    --text: #e8ecfb;
    --text-dim: #8790b5;
    --text-faint: #4e5872;
    --user-bubble: #2a48c8;
    --caret: #6f93ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: radial-gradient(80% 60% at 50% 38%, #182a55 0%, #101a38 45%, #0b0f1d 100%);
    background-attachment: fixed;
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: stretch;
  }

  /* App shell — fills the viewport so it deploys as a full page.
     Wrap in a fixed-size card instead if you prefer the mockup framing. */
  .app {
    width: 100%;
    max-width: 840px;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    background: transparent;
  }

  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--accent-grad); color: #eaf0ff; font-size: 19px;
  }
  .brand-name { font-size: 15px; font-weight: 600; }
  .brand-sub { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #69739a; }
  .new-chat {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 13px; background: var(--panel);
    border: 1px solid var(--border-input); border-radius: 9px;
    color: #a8b4d6; font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .new-chat:hover { background: #14203c; }

  /* Message scroll region */
  main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* Empty welcome state */
  .welcome {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 44px; text-align: center;
  }
  .welcome .logo-lg {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; border-radius: 17px;
    background: var(--accent-grad); color: #eaf0ff; font-size: 34px;
    margin-bottom: 24px; box-shadow: 0 12px 30px -8px rgba(51,72,196,.6);
  }
  .welcome h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 10px; }
  .welcome p { color: var(--text-dim); font-size: 15px; line-height: 1.55; max-width: 420px; margin: 0; }

  /* Conversation */
  .messages { padding: 30px 34px; display: flex; flex-direction: column; gap: 24px; }
  .msg-user { display: flex; justify-content: flex-end; }
  .msg-user .bubble {
    max-width: 70%; background: var(--user-bubble); color: #f2f5ff;
    padding: 12px 16px; border-radius: 14px 14px 4px 14px;
  }
  .msg-bot { display: flex; gap: 12px; align-items: flex-start; }
  .msg-bot .avatar {
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    width: 31px; height: 31px; border-radius: 8px;
    background: var(--accent-grad); color: #eaf0ff; font-size: 16px; margin-top: 2px;
  }
  .msg-bot .body {
    max-width: 620px; color: #d3dbf2; font-size: 14.5px; line-height: 1.65;
    white-space: pre-wrap; padding-top: 4px;
  }
  .msg-bot .body .caret {
    display: inline-block; width: 8px; height: 17px; background: var(--caret);
    margin-left: 3px; vertical-align: -3px; animation: blink 1s step-end infinite;
  }
  .msg-bot .body ul { margin: 8px 0; padding-left: 20px; }
  .msg-bot .body li { margin: 4px 0; }
  .msg-bot .body strong { color: #eaf0ff; font-weight: 600; }
  .msg-bot .body p { margin: 8px 0; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* Typing dots (before first token) */
  .dots { display: inline-flex; gap: 4px; padding-top: 8px; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--caret);
    animation: dot 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* Composer */
  footer { padding: 18px 34px 24px; flex-shrink: 0; }
  .composer {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--border-input);
    border-radius: 13px; padding: 8px 8px 8px 18px;
  }
  .composer:focus-within { border-color: #3d5fc4; }
  .composer input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #dbe3f7; font-family: inherit; font-size: 14px;
  }
  .composer button {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; background: var(--accent);
    border: none; border-radius: 9px; color: #fff; font-size: 17px; cursor: pointer;
    flex-shrink: 0; transition: opacity .15s;
  }
  .composer button:hover { opacity: .9; }
  .composer button:disabled { opacity: .4; cursor: default; }
  .disclaimer {
    text-align: center; color: var(--text-faint); font-size: 11px;
    margin-top: 10px; font-family: 'IBM Plex Mono', monospace;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="logo"><i class="ph-fill ph-cloud-sun"></i></span>
        <div>
          <div class="brand-name">Cirrus</div>
          <div class="brand-sub">Weather Assistant</div>
        </div>
      </div>
      <button class="new-chat" id="newChat"><i class="ph ph-plus" style="font-size:15px;"></i>New chat</button>
    </header>

    <main id="main">
      <div class="welcome" id="welcome">
        <span class="logo-lg"><i class="ph-fill ph-cloud-sun"></i></span>
        <h1>Good afternoon.</h1>
        <p>Ask me about the weather anywhere in the world — forecasts, comparisons, or what to pack for a trip.</p>
      </div>
      <div class="messages" id="messages" style="display:none;"></div>
    </main>

    <footer>
      <form class="composer" id="composer" autocomplete="off">
        <input id="input" placeholder="Ask about the weather anywhere…" />
        <button type="submit" id="send" aria-label="Send"><i class="ph-fill ph-paper-plane-right"></i></button>
      </form>
      <div class="disclaimer">Cirrus can make mistakes. Verify critical forecasts.</div>
    </footer>
  </div>

<script>
  const SESSION_ID = 'sess-' + Math.random().toString(36).slice(2);
  const main      = document.getElementById('main');
  const welcome   = document.getElementById('welcome');
  const messages  = document.getElementById('messages');
  const composer  = document.getElementById('composer');
  const input     = document.getElementById('input');
  const sendBtn   = document.getElementById('send');
  const newChatBtn= document.getElementById('newChat');

  let busy = false;

  function scrollToBottom() { main.scrollTop = main.scrollHeight; }

  function showConversation() {
    welcome.style.display = 'none';
    messages.style.display = 'flex';
  }

  function addUserMessage(text) {
    const el = document.createElement('div');
    el.className = 'msg-user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    el.appendChild(bubble);
    messages.appendChild(el);
    scrollToBottom();
  }

  // Creates an empty assistant message and returns its text node container.
  function addBotMessage() {
    const el = document.createElement('div');
    el.className = 'msg-bot';
    el.innerHTML = `
      <span class="avatar"><i class="ph-fill ph-cloud-sun"></i></span>
      <div class="body"><span class="dots"><span></span><span></span><span></span></span></div>`;
    messages.appendChild(el);
    scrollToBottom();
    return el.querySelector('.body');
  }

  // ── Renders streamed text into the assistant bubble with a live caret. ──
function renderStreaming(body, fullText) {
    body.innerHTML = marked.parse(fullText);
    const caret = document.createElement('span');
    caret.className = 'caret';
    body.appendChild(caret);
    scrollToBottom();
}

function finishStreaming(body, fullText) {
    body.innerHTML = marked.parse(fullText);
    scrollToBottom();
}

  /* ══════════════════════════════════════════════════════════════════════
     CONNECT YOUR WORKFLOW HERE.

     Replace the body of getResponse() with a call to your backend.
     It must be an async generator that yields text chunks as they arrive.

     ── Example: streaming from a fetch endpoint (SSE / chunked text) ──
       async function* getResponse(userText, history) {
         const res = await fetch('/api/chat', {
           method: 'POST',
           headers: { 'Content-Type': 'application/json' },
           body: JSON.stringify({ message: userText, history })
         });
         const reader = res.body.getReader();
         const decoder = new TextDecoder();
         while (true) {
           const { done, value } = await reader.read();
           if (done) break;
           yield decoder.decode(value, { stream: true });
         }
       }

     ── Or, non-streaming (yield once) ──
       async function* getResponse(userText, history) {
         const res = await fetch('/api/chat', { ... });
         const data = await res.json();
         yield data.reply;
       }

     `history` is an array of { role: 'user' | 'assistant', content: string }.
     ══════════════════════════════════════════════════════════════════════ */
  const history = [];

const ENDPOINT = '/chat';

async function* getResponse(userText, history) {
  const res = await fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: userText,
      session_id: SESSION_ID,  
      history
    })
  });

  if (!res.ok) throw new Error('endpoint error: ' + res.status);

  const data = await res.json();
  yield data.reply;   // matches the { "reply": ... } from Respond to Webhook
}

  async function handleSend(text) {
    if (busy || !text.trim()) return;
    busy = true;
    sendBtn.disabled = true;

    showConversation();
    addUserMessage(text);
    history.push({ role: 'user', content: text });

    const body = addBotMessage();
    let full = '';
    try {
      for await (const chunk of getResponse(text, history)) {
        full += chunk;
        renderStreaming(body, full.trimEnd());
      }
    } catch (err) {
      full = '⚠️ Something went wrong reaching the forecast service. Please try again.';
      console.error(err);
    }
    finishStreaming(body, full.trim());
    history.push({ role: 'assistant', content: full.trim() });

    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value;
    input.value = '';
    handleSend(text);
  });

  newChatBtn.addEventListener('click', () => {
    if (busy) return;
    messages.innerHTML = '';
    messages.style.display = 'none';
    welcome.style.display = 'flex';
    history.length = 0;
    input.focus();
  });

  input.focus();
</script>
</body>
</html>
